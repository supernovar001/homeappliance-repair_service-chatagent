# Render 배포 설정 (Blueprint)
# 무료 티어는 RAM 512MB, 15분 미접속 시 절전 후 다음 접속에서 다시 깨어납니다.
services:
  - type: web
    name: homeappliance-repair-service-chatagent
    # final_capstone/practice/Dockerfile로 이미지를 빌드해 실행합니다.
    runtime: docker
    # 경로는 레포 루트 기준입니다.
    dockerfilePath: ./final_capstone/practice/Dockerfile
    dockerContext: ./final_capstone/practice
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      # 대시보드에서 직접 입력합니다. 레포에 키를 넣지 않습니다.
      - key: OPENAI_API_KEY
        sync: false
